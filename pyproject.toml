[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-segments"
version = "0.1.0"
description = "Variable-length market wave segmentation with probabilistic labels and abstention"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "plotly>=5.18",
  "joblib>=1.3",
]

[project.optional-dependencies]
data = ["tushare>=1.4"]
changepoint = ["ruptures>=1.1.9"]
dev = ["pytest>=7.4", "ruff>=0.4"]
annotation = ["streamlit>=1.35"]
discovery = ["hdbscan>=0.8.38"]

[project.scripts]
wave-segments = "wave_segments.cli:main"
wave-annotate = "wave_segments.annotation_app:main"
wave-validate-classifier = "wave_segments.classification_cli:main"
wave-validate-selection = "wave_segments.selection_cli:main"
wave-build-dataset = "wave_segments.dataset_cli:main"
wave-build-review-sample = "wave_segments.review_cli:main"
wave-audit-market-data = "wave_segments.market_data_cli:main"
wave-build-bulk-market-data = "wave_segments.bulk_market_data_cli:main"
wave-audit-bulk-market-data = "wave_segments.bulk_market_audit_cli:main"
wave-build-fullmarket-segments = "wave_segments.fullmarket_segments_cli:main"
wave-audit-fullmarket-segments = "wave_segments.fullmarket_segments_audit_cli:main"
wave-discover-fullmarket = "wave_segments.fullmarket_discovery_cli:main"
wave-build-causal-segments = "wave_segments.causal_segments_cli:main"
wave-discover-causal-states = "wave_segments.causal_discovery_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
